<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>グスクラボ運営ハンドブック</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --surface:#ffffff;
  --surface-2:#f4f1ea;
  --border:#e3ddd0;
  --ink:#2a2622;
  --ink-soft:#726a5c;
  --accent:#b5542f;
  --accent-ink:#fff8ef;
  --primary:#1f3a5f;
  --primary-ink:#fdf9f0;
  --ok:#3f7d52;
  --ok-bg:#e4efe4;
  --pending:#9c8f76;
  --pending-bg:#eee6d4;
  --danger:#a23c2f;
  --danger-bg:#f6e4df;
  --shadow:0 8px 24px -14px rgba(42,38,34,0.18);
  --radius:10px;
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;}
a{color:var(--primary);}
button{font-family:var(--sans);cursor:pointer;}
input,textarea{font-family:var(--sans);}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
::selection{background:var(--accent);color:var(--accent-ink);}
.num{font-variant-numeric:tabular-nums;}
.modal-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(circle at 20% 15%, color-mix(in srgb, var(--primary) 20%, transparent), transparent 55%),
             radial-gradient(circle at 85% 85%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 55%),
             color-mix(in srgb, var(--ink) 45%, transparent);}
.lock-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:36px 32px;text-align:center;}
.lock-mark{width:52px;height:52px;margin:0 auto 16px;border-radius:12px;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-size:24px;}
.lock-card h1{font-size:20px;font-weight:700;margin-bottom:6px;}
.lock-card p.lead{color:var(--ink-soft);font-size:13px;margin:0 0 22px;}
.lock-card input[type="password"]{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font-size:16px;letter-spacing:0.04em;}
.lock-card .err{min-height:20px;color:var(--danger);font-size:13px;margin-top:8px;}
.lock-btn{margin-top:16px;width:100%;padding:12px 14px;border:none;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:700;}
.lock-btn[disabled]{opacity:0.6;}
.lock-cancel{margin-top:8px;width:100%;padding:11px 14px;border:1px dashed var(--border);border-radius:8px;background:transparent;color:var(--primary);font-size:13px;font-weight:700;}
.lock-note{margin-top:20px;font-size:11.5px;color:var(--ink-soft);line-height:1.6;border-top:1px dashed var(--border);padding-top:14px;}
#app{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.topbar .brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;}
.topbar .brand .kicker{font-size:11px;letter-spacing:0.12em;color:var(--accent);font-weight:700;text-transform:uppercase;}
.topbar .brand h1{font-size:17px;font-weight:700;}
.topbar .brand .sub{font-size:12px;color:var(--ink-soft);}
.modeswitch{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
.modeswitch button{border:none;background:transparent;color:var(--ink-soft);padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;}
.modeswitch button.active{background:var(--primary);color:var(--primary-ink);}
.save-btn,.login-btn{border:none;border-radius:8px;background:var(--accent);color:var(--accent-ink);padding:9px 18px;font-size:13px;font-weight:700;white-space:nowrap;}
.login-btn{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}
.save-btn[disabled]{opacity:0.6;cursor:default;}
.status-pill{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--border);color:var(--ink-soft);white-space:nowrap;}
.status-pill.ok{color:var(--ok);border-color:color-mix(in srgb, var(--ok) 40%, var(--border));background:var(--ok-bg);}
.status-pill.warn{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 40%, var(--border));background:var(--danger-bg);}
.layout{display:flex;flex:1;min-height:0;}
.sidenav{width:216px;flex:none;border-right:1px solid var(--border);background:var(--surface);padding:20px 12px;position:sticky;top:57px;align-self:flex-start;height:calc(100vh - 57px);overflow-y:auto;}
.sidenav .progress-chip{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:0 4px 16px;font-size:12px;color:var(--ink-soft);}
.sidenav .progress-chip b{font-family:var(--serif);color:var(--ink);font-size:15px;}
.sidenav a{display:block;padding:8px 12px;border-radius:8px;font-size:13px;color:var(--ink-soft);text-decoration:none;font-weight:500;}
.sidenav a:hover{background:var(--surface-2);color:var(--ink);}
main{flex:1;min-width:0;padding:28px 32px 80px;}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:36px;}
section.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);}
section.card > h2{font-size:19px;font-weight:700;margin-bottom:4px;display:flex;align-items:baseline;gap:10px;}
section.card > h2 .no{color:var(--accent);font-size:13px;font-family:var(--sans);font-weight:700;}
section.card > .desc{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
section.card .label{font-size:12.5px;color:var(--ink-soft);font-weight:700;margin:18px 0 8px;}
section.card .label:first-of-type{margin-top:0;}
dl.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;margin:0;}
dl.kv dt{font-size:12px;color:var(--ink-soft);padding-top:2px;}
dl.kv dd{margin:0;font-size:14px;}
dl.kv dd ul{margin:2px 0 0;padding-left:18px;}
.concept-box{margin-top:16px;padding:14px 16px;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-size:13.5px;color:var(--ink);}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
table th{text-align:left;background:var(--surface-2);color:var(--ink-soft);font-size:11.5px;letter-spacing:0.04em;text-transform:uppercase;font-weight:700;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
table tr:last-child td{border-bottom:none;}
table tr.total td{font-weight:700;background:var(--surface-2);}
table td.time{white-space:nowrap;font-weight:700;color:var(--primary);}
.pillrow{display:flex;flex-wrap:wrap;gap:8px;}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-soft);}
.seats-pill{display:inline-block;margin-top:12px;font-size:12px;padding:6px 14px;border-radius:999px;background:var(--ok-bg);border:1px solid color-mix(in srgb, var(--ok) 35%, var(--border));color:var(--ok);font-weight:700;}
.seats-pill.full{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 35%, var(--border));background:var(--danger-bg);}
.subtotal-line{display:flex;justify-content:space-between;padding:10px 4px;font-size:13.5px;font-weight:700;}
.balance-box{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:10px;margin-top:16px;background:var(--ok-bg);border:1px solid color-mix(in srgb, var(--ok) 35%, var(--border));}
.balance-box.neg{background:var(--danger-bg);border-color:color-mix(in srgb, var(--danger) 35%, var(--border));}
.balance-box .blabel{font-size:12.5px;color:var(--ink-soft);}
.balance-box .bamount{font-family:var(--serif);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ok);}
.balance-box.neg .bamount{color:var(--danger);}
ul.plain{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;}
ul.plain li{font-size:13.5px;padding-left:16px;position:relative;}
ul.plain li::before{content:"—";position:absolute;left:0;color:var(--accent);}
.checklist{display:flex;flex-direction:column;gap:7px;}
.check-row{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;padding:5px 2px;}
.check-row .box{flex:none;width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;margin-top:1px;color:var(--accent-ink);font-size:11px;}
.check-row.done .box{background:var(--ok);border-color:var(--ok);}
.check-row.done span.txt{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--pending);}
.cat-block{border-top:1px solid var(--border);padding-top:14px;margin-top:14px;}
.cat-block:first-child{border-top:none;padding-top:0;margin-top:0;}
.cat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cat-head h3{font-size:14.5px;font-weight:700;}
.cat-count{font-size:11.5px;color:var(--ink-soft);background:var(--surface-2);border-radius:999px;padding:3px 9px;border:1px solid var(--border);}
.cat-count.full{color:var(--ok);}
.speaker-card{border:1px solid var(--border);border-radius:8px;padding:16px;background:var(--surface-2);}
.speaker-card + .speaker-card{margin-top:12px;}
.speaker-card .name{font-family:var(--serif);font-size:16px;font-weight:700;}
.speaker-card .title{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:6px;}
.speaker-card .bio{font-size:13px;color:var(--ink-soft);}
footer.foot{text-align:center;font-size:11.5px;color:var(--ink-soft);padding:24px 0 40px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:11.5px;color:var(--ink-soft);font-weight:700;letter-spacing:0.02em;}
.field input[type="text"], .field input[type="number"], .field textarea{width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font-size:13.5px;}
.field textarea{resize:vertical;min-height:64px;line-height:1.6;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
.list-lines{display:flex;flex-direction:column;gap:8px;}
.line-row{display:flex;gap:8px;align-items:flex-start;}
.line-row input[type="text"]{flex:1;}
.row-x{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--danger);font-size:14px;line-height:1;}
.row-x:hover{background:var(--danger-bg);}
.add-btn{align-self:flex-start;margin-top:4px;border:1px dashed var(--border);background:transparent;color:var(--primary);padding:8px 14px;border-radius:7px;font-size:12.5px;font-weight:700;}
.add-btn:hover{background:var(--surface-2);}
.edit-table-row{display:grid;gap:8px;align-items:start;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--border);}
.edit-table-row:last-of-type{border-bottom:none;}
.chk-row{display:flex;align-items:center;gap:9px;}
.chk-row input[type="checkbox"]{width:17px;height:17px;accent-color:var(--ok);flex:none;}
.chk-row input[type="text"]{flex:1;}
.cat-name-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.cat-name-row input[type="text"]{font-family:var(--serif);font-weight:700;font-size:14.5px;}
.ticket-row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;border-bottom:1px dashed var(--border);padding-bottom:10px;margin-bottom:10px;}
.ticket-row:last-of-type{border-bottom:none;}
.ticket-row .field{margin-bottom:0;}
.tw-tier{width:180px;flex:1 1 180px;}
.tw-num{width:110px;}
.computed{padding:9px 11px;border-radius:7px;background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);font-size:13.5px;font-variant-numeric:tabular-nums;font-weight:700;min-width:110px;}
.money-row{display:flex;gap:10px;align-items:end;margin-bottom:8px;}
.money-row .mw-item{flex:1;}
.money-row .mw-amt{width:140px;}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:18px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);}
.legend-badge{width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;}
.label-palette-row{margin-bottom:16px;}
.label-palette{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.label-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700;}
.label-btn.active{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);}
.formation-block{border-top:1px solid var(--border);padding-top:16px;margin-top:16px;}
.formation-block:first-of-type{border-top:none;padding-top:0;margin-top:0;}
.formation-title-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.formation-title-row h3{font-size:15px;font-weight:700;}
.formation-title-row input{flex:1;font-family:var(--serif);font-weight:700;font-size:14.5px;}
.hint{font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;}
.floorplan-wrap{position:relative;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface-2);cursor:crosshair;touch-action:manipulation;max-width:420px;}
.floorplan-wrap.readonly{cursor:default;}
.floorplan-svg{display:block;width:100%;height:auto;}
.fp-stage{fill:var(--surface-2);stroke:var(--border);stroke-width:2;}
.fp-seat{fill:var(--surface);stroke:var(--border);stroke-width:2;}
.fp-row{stroke:var(--border);stroke-width:1;opacity:0.5;}
.fp-aisle{stroke:var(--border);stroke-width:1;stroke-dasharray:4 4;opacity:0.7;}
.fp-lobby{fill:var(--surface-2);stroke:var(--border);stroke-width:2;}
.fp-desk{fill:var(--pending-bg);stroke:var(--border);}
.fp-door{fill:var(--ok-bg);stroke:var(--border);}
.fp-label{fill:var(--ink-soft);font-size:20px;font-family:var(--serif);}
.fp-label-sm{fill:var(--ink-soft);font-size:13px;font-family:var(--sans);}
.marker{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,0.3);}
.marker.editable{cursor:pointer;}
.marker.editable:hover{outline:2px solid var(--danger);}
@media (max-width:860px){
  body{font-size:16px;}
  .layout{flex-direction:column;}
  .sidenav{position:static;width:auto;min-width:0;max-width:100%;height:auto;display:flex;overflow-x:auto;gap:6px;padding:10px 12px;border-right:none;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;}
  .sidenav .progress-chip{display:none;}
  .sidenav a{white-space:nowrap;padding:10px 13px;}
  main{padding:16px 14px 70px;}
  .wrap{gap:20px;}
  section.card{padding:18px 16px;}
  dl.kv{grid-template-columns:1fr;gap:4px 0;}
  dl.kv dt{padding-top:10px;}
  dl.kv dt:first-child{padding-top:0;}
  .grid2{grid-template-columns:1fr;}
  .floorplan-wrap{max-width:100%;}
  .topbar{padding:10px 14px;gap:10px;}
  .topbar .brand .kicker{display:none;}
  .topbar .brand h1{font-size:16px;}
  .topbar .brand{width:100%;}
  .modeswitch{order:2;}
  .status-pill{order:3;flex:1;text-align:center;}
  .save-btn{order:4;width:100%;padding:12px 18px;}
  .login-btn{order:4;width:100%;padding:12px 18px;}
  .field input[type="text"], .field input[type="number"], .field textarea{font-size:16px;}
  .row-x{width:36px;height:36px;font-size:16px;}
  .add-btn{padding:11px 16px;font-size:13.5px;}
  .modeswitch button{padding:10px 18px;font-size:14px;}
  .label-btn{width:42px;height:42px;font-size:14px;}
  .marker{width:32px;height:32px;margin:-16px 0 0 -16px;font-size:13px;}
  table th, table td{padding:10px 10px;}
  .chk-row input[type="checkbox"]{width:20px;height:20px;}
}
@media (prefers-reduced-motion:no-preference){
  .save-btn, .login-btn, .modeswitch button, .add-btn, .row-x{transition:opacity .15s ease, background-color .15s ease;}
}
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="kicker">Gusuku Lab Symposium 01</span>
      <h1>グスクラボ運営ハンドブック</h1>
      <span class="sub" id="brandSub"></span>
    </div>
    <div class="modeswitch" id="modeSwitchBox" hidden>
      <button id="btnView" class="active" type="button">閲覧</button>
      <button id="btnEdit" type="button">編集</button>
    </div>
    <span class="status-pill" id="statusPill">読み込み中…</span>
    <button class="save-btn" id="btnSave" type="button" hidden>変更を保存して共有</button>
    <button class="login-btn" id="btnLogin" type="button">編集者ログイン</button>
    <button class="login-btn" id="btnLogout" type="button" hidden>ログアウト</button>
  </header>
  <div class="layout">
    <nav class="sidenav" id="sidenav">
      <div class="progress-chip"><span>準備進捗</span><b id="progressText">—</b></div>
      <a href="#sec-overview">1. イベント概要</a>
      <a href="#sec-speakers">2. 登壇者プロフィール</a>
      <a href="#sec-schedule">3. 当日タイムスケジュール</a>
      <a href="#sec-budget">4. 収支</a>
      <a href="#sec-staff">5. 運営スタッフ</a>
      <a href="#sec-prep">6. 準備スケジュール</a>
      <a href="#sec-todo">7. 項目別やることリスト</a>
      <a href="#sec-equipment">8. 必要備品チェックリスト</a>
      <a href="#sec-formations">9. 会場・スタッフ配置</a>
    </nav>
    <main><div class="wrap" id="content"></div></main>
  </div>
</div>

<div id="loginModal" class="modal-overlay" hidden>
  <div class="lock-card">
    <div class="lock-mark">&#127968;</div>
    <h1>編集者ログイン</h1>
    <p class="lead">コアメンバー用のパスワードを入力してください。</p>
    <input id="pw" type="password" placeholder="パスワード" autocomplete="current-password" />
    <div class="err" id="pwErr"></div>
    <button class="lock-btn" id="pwBtn" type="button">ログイン</button>
    <button class="lock-cancel" id="pwCancel" type="button">キャンセル</button>
    <p class="lock-note">※閲覧はどなたでも自由にできます。編集・保存はコアメンバーのログインが必要です。</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

/* ============================================================
   FIREBASE SETUP — replace with your own project's values.
   See the setup guide for exactly where to get these.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyB7hQCnXAL9aqACCnpenPyY9jMDLZcQxek",
  authDomain: "gusukulab-handbook.firebaseapp.com",
  projectId: "gusukulab-handbook",
  storageBucket: "gusukulab-handbook.firebasestorage.app",
  messagingSenderId: "366780142394",
  appId: "1:366780142394:web:edaa67ae39662987607603"
};
/* This is a fixed internal login ID, not a real inbox — you create it
   as a user in the Firebase console (Authentication > Users > Add user)
   together with the password your core members will type in. */
const EDITOR_EMAIL = "core@gusukulab-handbook.local";

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function yen(n){
  var v = Math.round(Number(n) || 0);
  var neg = v < 0;
  var s = "¥" + Math.abs(v).toLocaleString("ja-JP");
  return neg ? "−" + s : s;
}

/* ---------- path helpers ---------- */
function pathParts(path){ return path.split(".").map(function(p){ return /^\d+$/.test(p) ? Number(p) : p; }); }
function getPath(root, path){
  var parts = pathParts(path), o = root;
  for (var i=0;i<parts.length;i++){ if(o==null) return undefined; o = o[parts[i]]; }
  return o;
}
function setPath(root, path, value){
  var parts = pathParts(path), o = root;
  for (var i=0;i<parts.length-1;i++){ o = o[parts[i]]; }
  o[parts[parts.length-1]] = value;
}
function removeAt(root, path){
  var parts = pathParts(path);
  var idx = parts.pop();
  var o = root;
  for (var i=0;i<parts.length;i++){ o = o[parts[i]]; }
  o.splice(idx, 1);
}
function templateFor(kind){
  switch(kind){
    case "speaker": return {name:"",title:"",bio:""};
    case "schedule": return {time:"",content:""};
    case "dayop": return "";
    case "ticket": return {tier:"新しい区分",unitPrice:0,count:0};
    case "otherincome": return {item:"",amount:0};
    case "expense": return {item:"",amount:0};
    case "staff": return {name:"",role:""};
    case "dayrole": return {role:"",count:""};
    case "prep": return {month:"",plan:"",status:""};
    case "priority": return {text:"",checked:false};
    case "equipment": return {text:"",checked:false};
    case "category": return {category:"新しいカテゴリ", items:[]};
    case "formation": return {title:"新しい場面", markers:[]};
    case "item": return {text:"",checked:false};
    default: return {};
  }
}

/* ---------- budget calculations ---------- */
function ticketSubtotal(t){ return (Number(t.unitPrice)||0) * (Number(t.count)||0); }
function ticketTotalCount(){ return DATA.budget.tickets.reduce(function(s,t){ return s+(Number(t.count)||0); },0); }
function ticketTotalAmount(){ return DATA.budget.tickets.reduce(function(s,t){ return s+ticketSubtotal(t); },0); }
function otherIncomeTotal(){ return DATA.budget.otherIncome.reduce(function(s,r){ return s+(Number(r.amount)||0); },0); }
function incomeTotal(){ return ticketTotalAmount() + otherIncomeTotal(); }
function expenseTotal(){ return DATA.budget.expense.reduce(function(s,r){ return s+(Number(r.amount)||0); },0); }
function balanceAmount(){ return incomeTotal() - expenseTotal(); }

function stats(){
  var done=0, total=0;
  (DATA.todoCategories||[]).forEach(function(c){ (c.items||[]).forEach(function(i){ total++; if(i.checked) done++; }); });
  (DATA.equipment||[]).forEach(function(i){ total++; if(i.checked) done++; });
  (DATA.priority8||[]).forEach(function(i){ total++; if(i.checked) done++; });
  return {done:done, total:total};
}

function updateComputedFields(){
  DATA.budget.tickets.forEach(function(t,i){
    var el = document.getElementById("ticket-subtotal-"+i);
    if (el) el.textContent = yen(ticketSubtotal(t));
  });
  var tc = document.getElementById("calc-ticket-count-total"); if (tc) tc.textContent = ticketTotalCount()+" 名";
  var ta = document.getElementById("calc-ticket-amount-total"); if (ta) ta.textContent = yen(ticketTotalAmount());
  var oi = document.getElementById("calc-income-other-total"); if (oi) oi.textContent = yen(otherIncomeTotal());
  var it = document.getElementById("calc-income-total"); if (it) it.textContent = yen(incomeTotal());
  var et = document.getElementById("calc-expense-total"); if (et) et.textContent = yen(expenseTotal());
  var bal = balanceAmount();
  var balEl = document.getElementById("calc-balance");
  if (balEl){ balEl.textContent = yen(bal); }
  var box = document.getElementById("balance-box");
  if (box){ box.classList.toggle("neg", bal < 0); }
  var seatsEl = document.getElementById("calc-seats-left");
  if (seatsEl){
    var cap = Number(DATA.overview.capacityNumber)||0, left = cap - ticketTotalCount();
    seatsEl.textContent = left<=0 ? "満席" : ("残席 "+left+" / "+cap+" 名");
    seatsEl.classList.toggle("full", left<=0);
  }
  updateSidebarProgress();
}

/* ---------- delegated edit events ---------- */
function onContentInput(e){
  var t = e.target;
  if (!t.dataset || !t.dataset.path) return;
  if (t.type === "checkbox") return;
  setPath(DATA, t.dataset.path, t.value);
  updateComputedFields();
}
function onContentChange(e){
  var t = e.target;
  if (!t.dataset || !t.dataset.path) return;
  if (t.type === "checkbox"){ setPath(DATA, t.dataset.path, t.checked); updateComputedFields(); }
}
function onContentClick(e){
  var markerEl = e.target.closest(".marker");
  if (markerEl && markerEl.classList.contains("editable")){
    var wrapEl0 = markerEl.closest(".floorplan-wrap");
    var fi0 = Number(wrapEl0.dataset.formation);
    var mi0 = Number(markerEl.dataset.markerIdx);
    DATA.formations[fi0].markers.splice(mi0, 1);
    renderEdit();
    return;
  }
  var wrapEl = e.target.closest(".floorplan-wrap");
  if (wrapEl && !wrapEl.classList.contains("readonly")){
    var fi = Number(wrapEl.dataset.formation);
    var rect = wrapEl.getBoundingClientRect();
    var x = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
    var y = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
    DATA.formations[fi].markers.push({label: currentLabel, x: Math.round(x*10)/10, y: Math.round(y*10)/10});
    renderEdit();
    return;
  }
  var t = e.target.closest("[data-action]");
  if (!t) return;
  var action = t.dataset.action;
  if (action === "remove"){ removeAt(DATA, t.dataset.path); renderEdit(); updateComputedFields(); }
  else if (action === "add"){ getPath(DATA, t.dataset.path).push(templateFor(t.dataset.kind)); renderEdit(); updateComputedFields(); }
  else if (action === "pick-label"){ currentLabel = t.dataset.label; renderEdit(); }
}
document.getElementById("content").addEventListener("input", onContentInput);
document.getElementById("content").addEventListener("change", onContentChange);
document.getElementById("content").addEventListener("click", onContentClick);

/* ---------- mode + toolbar ---------- */
function setStatus(text, kind){
  var el = document.getElementById("statusPill");
  el.textContent = text;
  el.className = "status-pill" + (kind ? " " + kind : "");
}
function updateSidebarProgress(){
  var s = stats();
  var el = document.getElementById("progressText");
  if (el) el.textContent = s.done + " / " + s.total;
}
function refreshUI(){
  document.getElementById("modeSwitchBox").hidden = !isEditor;
  document.getElementById("btnLogin").hidden = isEditor;
  document.getElementById("btnLogout").hidden = !isEditor;
  if (!isEditor) mode = "view";
  document.getElementById("btnView").classList.toggle("active", mode === "view");
  document.getElementById("btnEdit").classList.toggle("active", mode === "edit");
  document.getElementById("btnSave").hidden = !(isEditor && mode === "edit");
  if (!DATA) return;
  document.getElementById("brandSub").textContent = DATA.overview.title;
  if (mode === "edit") renderEdit(); else renderView();
  updateSidebarProgress();
  if (!saving) setStatus(isEditor ? (mode === "edit" ? "編集モード — 保存すると全員に共有されます" : "閲覧モード（編集者としてログイン中）") : "閲覧モード");
}
function setMode(next){ mode = next; refreshUI(); }

document.getElementById("btnView").addEventListener("click", function(){ setMode("view"); });
document.getElementById("btnEdit").addEventListener("click", function(){ setMode("edit"); });

/* ---------- save ---------- */
function handleSave(){
  if (!isEditor || !DATA) return;
  var btn = document.getElementById("btnSave");
  btn.disabled = true;
  saving = true;
  setStatus("保存中…");
  setDoc(DOC_REF, DATA)
    .then(function(){
      setStatus("保存しました", "ok");
      saving = false;
      btn.disabled = false;
      setTimeout(function(){ if (!saving) refreshUI(); }, 1500);
    })
    .catch(function(err){
      console.error(err);
      setStatus("保存に失敗しました。通信状況を確認して再試行してください。", "warn");
      saving = false;
      btn.disabled = false;
    });
}
document.getElementById("btnSave").addEventListener("click", handleSave);

/* ---------- Firestore live sync ---------- */
onSnapshot(DOC_REF, function(snap){
  if (snap.exists()){
    DATA = snap.data();
  } else if (!DATA){
    DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  refreshUI();
}, function(err){
  console.error(err);
  if (!DATA) DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
  setStatus("データの取得に失敗しました（表示は初期データです）", "warn");
  refreshUI();
});

/* ---------- auth / login modal ---------- */
function showLogin(){
  document.getElementById("pw").value = "";
  document.getElementById("pwErr").textContent = "";
  document.getElementById("loginModal").hidden = false;
  document.getElementById("pw").focus();
}
function hideLogin(){ document.getElementById("loginModal").hidden = true; }

function tryLogin(){
  var pwVal = document.getElementById("pw").value;
  var btn = document.getElementById("pwBtn");
  btn.disabled = true;
  signInWithEmailAndPassword(auth, EDITOR_EMAIL, pwVal)
    .then(function(){ hideLogin(); btn.disabled = false; })
    .catch(function(err){
      document.getElementById("pwErr").textContent = "パスワードが違います。もう一度お試しください。";
      btn.disabled = false;
    });
}
document.getElementById("btnLogin").addEventListener("click", showLogin);
document.getElementById("pwCancel").addEventListener("click", hideLogin);
document.getElementById("pwBtn").addEventListener("click", tryLogin);
document.getElementById("pw").addEventListener("keydown", function(e){ if (e.key === "Enter") tryLogin(); });
document.getElementById("btnLogout").addEventListener("click", function(){ signOut(auth); });

onAuthStateChanged(auth, function(user){
  isEditor = !!user;
  refreshUI();
});
</script>
