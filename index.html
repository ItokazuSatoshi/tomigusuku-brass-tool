<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>定期演奏会 運営チェックリスト＆予算管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #173d78; --navy-deep: #0b1e3f; --gold: #b8860b;
    --paper: #ffffff; --ink: #24304a; --ink-soft: #5a6478; --line-soft: #e4e8f0;
    --good: #2f7d4f; --good-bg: #eaf6ee; --bad: #c00000; --bad-bg: #fdecec;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--paper); margin: 0; }
  body {
    font-family: "Noto Sans JP", sans-serif; color: var(--ink);
    padding-bottom: calc(3rem + env(safe-area-inset-bottom));
  }
  header {
    background: var(--navy); color: #fff; padding: 1.2rem max(1.1rem, env(safe-area-inset-right)) 1.4rem max(1.1rem, env(safe-area-inset-left));
  }
  header h1 { font-family: "Zen Maru Gothic", sans-serif; font-size: clamp(1.05rem, 4.6vw, 1.35rem); margin: 0 0 0.5em; }
  header p { margin: 0; font-size: 0.8rem; opacity: 0.85; }

  .mode-bar {
    position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 1px solid var(--line-soft);
    display: flex; gap: 0.5rem; padding: 0.6rem max(1.1rem, env(safe-area-inset-right)) 0.6rem max(1.1rem, env(safe-area-inset-left));
    align-items: center; box-shadow: 0 4px 10px -8px rgba(0,0,0,0.3);
  }
  .mode-btn {
    flex: 1; padding: 0.55em 0.4em; border-radius: 999px; border: 1.5px solid var(--navy);
    background: #fff; color: var(--navy); font-weight: 700; font-family: "Zen Maru Gothic", sans-serif;
    font-size: 0.85rem;
  }
  .mode-btn.active { background: var(--navy); color: #fff; }
  .user-chip { font-size: 0.75rem; color: var(--ink-soft); white-space: nowrap; }
  .user-chip button { border: none; background: none; color: var(--gold); font-weight: 700; margin-left: 0.4em; padding: 0; }

  main { max-width: 680px; margin: 0 auto; padding: 1.1rem max(1.1rem, env(safe-area-inset-right)) 0 max(1.1rem, env(safe-area-inset-left)); }

  #login-panel {
    display: none; background: #fbfbfd; border: 1.5px solid var(--line-soft); border-radius: 14px;
    padding: 1.2rem; margin-top: 1rem;
  }
  #login-panel h2 { font-family: "Zen Maru Gothic", sans-serif; color: var(--navy); font-size: 1rem; margin: 0 0 0.8em; }
  #login-panel label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin: 0.6em 0 0.3em; }
  #login-panel input {
    width: 100%; padding: 0.65em 0.8em; border-radius: 8px; border: 1.5px solid var(--line-soft); font-size: 1rem;
  }
  #login-panel button.submit {
    margin-top: 1em; width: 100%; padding: 0.75em; border-radius: 999px; border: none;
    background: var(--gold); color: #fff; font-weight: 700; font-size: 0.95rem; font-family: "Zen Maru Gothic", sans-serif;
  }
  #login-err { color: var(--bad); font-size: 0.8rem; margin-top: 0.6em; display: none; }

  section.block { margin-top: 1.6rem; }
  section.block h2 {
    font-family: "Zen Maru Gothic", sans-serif; color: var(--navy); font-size: 1.1rem;
    border-left: 5px solid var(--gold); padding-left: 0.6em; margin: 0 0 0.8em;
  }

  .task-row {
    display: flex; align-items: flex-start; gap: 0.7rem; background: #fbfbfd; border: 1.5px solid var(--line-soft);
    border-radius: 12px; padding: 0.8rem 0.9rem; margin-bottom: 0.6rem;
  }
  .task-row.done { background: var(--good-bg); border-color: #cfe8d7; }
  .task-row input[type="checkbox"] { width: 1.3em; height: 1.3em; margin-top: 0.15em; accent-color: var(--good); flex: 0 0 auto; }
  .task-main { flex: 1; min-width: 0; }
  .task-phase { display: inline-block; background: var(--navy); color: #fff; font-size: 0.7rem; font-weight: 700;
    border-radius: 999px; padding: 0.1em 0.65em; margin-bottom: 0.35em; font-family: "Zen Maru Gothic", sans-serif; }
  .task-label { font-weight: 700; font-size: 0.95rem; line-height: 1.4; }
  .task-label.done-text { text-decoration: line-through; color: var(--ink-soft); }
  .task-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
  .task-meta input { font-size: 0.82rem; padding: 0.4em 0.6em; border-radius: 7px; border: 1.5px solid var(--line-soft); }
  .task-meta input.assignee { width: 7.5em; }
  .task-meta input.note { flex: 1; min-width: 8em; }
  .task-del { border: none; background: none; color: var(--bad); font-size: 1.1rem; padding: 0.2em; flex: 0 0 auto; }

  .add-row { display: flex; gap: 0.5rem; margin-top: 0.4rem; flex-wrap: wrap; }
  .add-row input, .add-row select {
    padding: 0.6em 0.7em; border-radius: 8px; border: 1.5px solid var(--line-soft); font-size: 0.9rem;
  }
  .add-row .grow { flex: 1; min-width: 9em; }
  .add-row button {
    padding: 0.6em 1.1em; border-radius: 999px; border: none; background: var(--navy); color: #fff;
    font-weight: 700; font-family: "Zen Maru Gothic", sans-serif; font-size: 0.85rem;
  }
  .seed-btn {
    display: block; width: 100%; margin-top: 0.6rem; padding: 0.7em; border-radius: 10px; border: 1.5px dashed var(--gold);
    background: #fffaf0; color: var(--gold); font-weight: 700; font-family: "Zen Maru Gothic", sans-serif; font-size: 0.85rem;
  }

  table.budget { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.budget th, table.budget td { border-bottom: 1px solid var(--line-soft); padding: 0.55em 0.4em; text-align: left; }
  table.budget th { color: var(--ink-soft); font-weight: 700; font-size: 0.78rem; }
  table.budget td.amount { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .type-income { color: var(--good); font-weight: 700; }
  .type-expense { color: var(--bad); font-weight: 700; }
  table.budget input { width: 100%; padding: 0.35em 0.5em; border-radius: 6px; border: 1.5px solid var(--line-soft); font-size: 0.85rem; }
  table.budget input.amount-input { text-align: right; }
  .budget-del { border: none; background: none; color: var(--bad); font-size: 1rem; }

  .budget-summary {
    display: flex; gap: 0.6rem; margin: 0.9rem 0; flex-wrap: wrap;
  }
  .budget-summary .tile {
    flex: 1; min-width: 8.5em; background: #fbfbfd; border: 1.5px solid var(--line-soft); border-radius: 12px;
    padding: 0.7rem 0.9rem;
  }
  .budget-summary .tile .lbl { font-size: 0.75rem; color: var(--ink-soft); }
  .budget-summary .tile .val { font-size: 1.15rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .budget-summary .tile.balance .val.plus { color: var(--good); }
  .budget-summary .tile.balance .val.minus { color: var(--bad); }

  .empty-note { color: var(--ink-soft); font-size: 0.85rem; padding: 1rem 0; text-align: center; }
  .sync-note { font-size: 0.72rem; color: var(--ink-soft); text-align: center; margin-top: 2rem; }
</style>
</head>
<body>

<header>
  <h1>定期演奏会 運営チェックリスト＆予算管理</h1>
  <p>豊見城中学校吹奏楽部 保護者会役員会・共有ツール</p>
</header>

<div class="mode-bar">
  <button class="mode-btn active" id="btn-view-mode" type="button">👀 閲覧モード</button>
  <button class="mode-btn" id="btn-edit-mode" type="button">✏️ 編集モード</button>
  <span class="user-chip" id="user-chip"></span>
</div>

<main>
  <div id="login-panel">
    <h2>編集にはログインが必要です</h2>
    <label>メールアドレス</label>
    <input type="email" id="login-email" autocomplete="username">
    <label>パスワード</label>
    <input type="password" id="login-password" autocomplete="current-password">
    <button class="submit" id="login-submit" type="button">ログイン</button>
    <p id="login-err"></p>
  </div>

  <section class="block">
    <h2>📋 フェーズ別 準備チェックリスト</h2>
    <div id="task-list"></div>
    <button class="seed-btn" id="seed-tasks-btn" type="button" style="display:none;">フェーズA〜Jのサンプルタスクを読み込む</button>
    <div class="add-row" id="add-task-row" style="display:none;">
      <select id="new-task-phase">
        <option value="A">A</option><option value="B">B</option><option value="C">C</option>
        <option value="D">D</option><option value="E">E</option><option value="F">F</option>
        <option value="G">G</option><option value="H">H</option><option value="I">I</option><option value="J">J</option>
      </select>
      <input class="grow" id="new-task-label" placeholder="やることを入力">
      <button id="new-task-add" type="button">追加</button>
    </div>
  </section>

  <section class="block">
    <h2>💰 予算・協賛金 収支表</h2>
    <div class="budget-summary">
      <div class="tile"><div class="lbl">収入合計</div><div class="val" id="sum-income">¥0</div></div>
      <div class="tile"><div class="lbl">支出合計</div><div class="val" id="sum-expense">¥0</div></div>
      <div class="tile balance"><div class="lbl">差引</div><div class="val" id="sum-balance">¥0</div></div>
    </div>
    <div style="overflow-x:auto;">
      <table class="budget">
        <thead><tr><th>区分</th><th>項目</th><th>金額</th><th>メモ</th><th></th></tr></thead>
        <tbody id="budget-body"></tbody>
      </table>
    </div>
    <div class="add-row" id="add-budget-row" style="display:none;">
      <select id="new-budget-type">
        <option value="income">収入</option>
        <option value="expense">支出</option>
      </select>
      <input class="grow" id="new-budget-label" placeholder="項目名">
      <input id="new-budget-amount" type="number" placeholder="金額" style="width:7em;">
      <button id="new-budget-add" type="button">追加</button>
    </div>
  </section>

  <p class="sync-note">保存すると全員の画面にリアルタイムで反映されます。</p>
</main>

<!-- Firebase SDK (compat / no-build) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
  // ▼▼▼ ここを Firebase コンソールで取得した値に書き換えてください ▼▼▼
  const firebaseConfig = {
    apiKey: "AIzaSyBDhVZCARNspG8jn03YEw51XmE9skQRWhA",
    authDomain: "tomigushuku-brass.firebaseapp.com",
    projectId: "tomigushuku-brass",
    storageBucket: "tomigushuku-brass.firebasestorage.app",
    messagingSenderId: "814869503284",
    appId: "1:814869503284:web:8a7ddcc32ea0422cd29961"
  };
  // ▲▲▲ ここまで ▲▲▲

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let mode = "view";          // "view" | "edit"
  let currentUser = null;
  let tasksCache = [];
  let budgetCache = [];

  const els = {
    btnView: document.getElementById("btn-view-mode"),
    btnEdit: document.getElementById("btn-edit-mode"),
    userChip: document.getElementById("user-chip"),
    loginPanel: document.getElementById("login-panel"),
    loginEmail: document.getElementById("login-email"),
    loginPassword: document.getElementById("login-password"),
    loginSubmit: document.getElementById("login-submit"),
    loginErr: document.getElementById("login-err"),
    taskList: document.getElementById("task-list"),
    addTaskRow: document.getElementById("add-task-row"),
    seedBtn: document.getElementById("seed-tasks-btn"),
    newTaskPhase: document.getElementById("new-task-phase"),
    newTaskLabel: document.getElementById("new-task-label"),
    newTaskAdd: document.getElementById("new-task-add"),
    budgetBody: document.getElementById("budget-body"),
    addBudgetRow: document.getElementById("add-budget-row"),
    newBudgetType: document.getElementById("new-budget-type"),
    newBudgetLabel: document.getElementById("new-budget-label"),
    newBudgetAmount: document.getElementById("new-budget-amount"),
    newBudgetAdd: document.getElementById("new-budget-add"),
    sumIncome: document.getElementById("sum-income"),
    sumExpense: document.getElementById("sum-expense"),
    sumBalance: document.getElementById("sum-balance"),
  };

  const yen = (n) => "¥" + Math.round(n).toLocaleString("ja-JP");
  const canEdit = () => mode === "edit" && !!currentUser;

  // ---------- モード / ログイン制御 ----------
  function setMode(next) {
    mode = next;
    els.btnView.classList.toggle("active", mode === "view");
    els.btnEdit.classList.toggle("active", mode === "edit");
    if (mode === "edit" && !currentUser) {
      els.loginPanel.style.display = "block";
    } else {
      els.loginPanel.style.display = "none";
    }
    renderTasks();
    renderBudget();
  }
  els.btnView.addEventListener("click", () => setMode("view"));
  els.btnEdit.addEventListener("click", () => setMode("edit"));

  els.loginSubmit.addEventListener("click", () => {
    els.loginErr.style.display = "none";
    auth.signInWithEmailAndPassword(els.loginEmail.value.trim(), els.loginPassword.value)
      .catch((err) => {
        els.loginErr.textContent = "ログインできませんでした（メールアドレスまたはパスワードをご確認ください）";
        els.loginErr.style.display = "block";
      });
  });

  auth.onAuthStateChanged((user) => {
    currentUser = user;
    if (user) {
      els.userChip.innerHTML = (user.email || "") + '<button id="logout-btn">ログアウト</button>';
      document.getElementById("logout-btn").addEventListener("click", () => auth.signOut());
      els.loginPanel.style.display = "none";
    } else {
      els.userChip.textContent = "";
    }
    els.addTaskRow.style.display = canEdit() ? "flex" : "none";
    els.addBudgetRow.style.display = canEdit() ? "flex" : "none";
    if (mode === "edit" && !user) els.loginPanel.style.display = "block";
    renderTasks();
    renderBudget();
  });

  // ---------- タスク（チェックリスト） ----------
  db.collection("tasks").orderBy("order").onSnapshot((snap) => {
    tasksCache = [];
    snap.forEach((doc) => tasksCache.push({ id: doc.id, ...doc.data() }));
    els.seedBtn.style.display = (tasksCache.length === 0 && canEdit()) ? "block" : "none";
    renderTasks();
  }, (err) => {
    els.taskList.innerHTML = '<p class="empty-note">読み込みエラー：Firebase設定・公開ルールをご確認ください</p>';
  });

  function renderTasks() {
    els.addTaskRow.style.display = canEdit() ? "flex" : "none";
    els.seedBtn.style.display = (tasksCache.length === 0 && canEdit()) ? "block" : "none";
    if (tasksCache.length === 0) {
      els.taskList.innerHTML = canEdit() ? "" : '<p class="empty-note">まだタスクがありません</p>';
      return;
    }
    els.taskList.innerHTML = "";
    tasksCache.forEach((t) => {
      const row = document.createElement("div");
      row.className = "task-row" + (t.done ? " done" : "");
      const editable = canEdit();
      row.innerHTML = `
        <input type="checkbox" ${t.done ? "checked" : ""} ${editable ? "" : "disabled"}>
        <div class="task-main">
          <span class="task-phase">${t.phase || ""}</span>
          <div class="task-label ${t.done ? "done-text" : ""}">${escapeHtml(t.label || "")}</div>
          <div class="task-meta">
            <input class="assignee" placeholder="担当者" value="${escapeHtml(t.assignee || "")}" ${editable ? "" : "disabled"}>
            <input class="note" placeholder="メモ" value="${escapeHtml(t.note || "")}" ${editable ? "" : "disabled"}>
          </div>
        </div>
        ${editable ? '<button class="task-del">✕</button>' : ""}
      `;
      row.querySelector('input[type="checkbox"]').addEventListener("change", (e) => {
        if (!canEdit()) return;
        db.collection("tasks").doc(t.id).update({ done: e.target.checked });
      });
      const assigneeInput = row.querySelector(".assignee");
      if (assigneeInput) assigneeInput.addEventListener("blur", (e) => {
        if (!canEdit()) return;
        db.collection("tasks").doc(t.id).update({ assignee: e.target.value });
      });
      const noteInput = row.querySelector(".note");
      if (noteInput) noteInput.addEventListener("blur", (e) => {
        if (!canEdit()) return;
        db.collection("tasks").doc(t.id).update({ note: e.target.value });
      });
      const delBtn = row.querySelector(".task-del");
      if (delBtn) delBtn.addEventListener("click", () => {
        if (!canEdit()) return;
        if (confirm("このタスクを削除しますか？")) db.collection("tasks").doc(t.id).delete();
      });
      els.taskList.appendChild(row);
    });
  }

  els.newTaskAdd.addEventListener("click", () => {
    if (!canEdit()) return;
    const label = els.newTaskLabel.value.trim();
    if (!label) return;
    db.collection("tasks").add({
      phase: els.newTaskPhase.value,
      label, done: false, assignee: "", note: "",
      order: tasksCache.length,
    });
    els.newTaskLabel.value = "";
  });

  els.seedBtn.addEventListener("click", () => {
    if (!canEdit()) return;
    const seed = [
      ["A", "会場予約・準備開始"], ["B", "保護者説明会・協賛依頼開始"],
      ["C", "協賛広告・協賛金の収集"], ["D", "パンフレット制作"], ["E", "DVD関連"],
      ["F", "当日運営の準備"], ["G", "定期演奏会（ホール練習日）"], ["H", "定期演奏会（本番）"],
      ["I", "3年生を送る会"], ["J", "事後対応・次年度への引継ぎ"],
    ];
    const batch = db.batch();
    seed.forEach(([phase, label], i) => {
      const ref = db.collection("tasks").doc();
      batch.set(ref, { phase, label, done: false, assignee: "", note: "", order: i });
    });
    batch.commit();
  });

  // ---------- 予算 ----------
  db.collection("budget").onSnapshot((snap) => {
    budgetCache = [];
    snap.forEach((doc) => budgetCache.push({ id: doc.id, ...doc.data() }));
    renderBudget();
  }, (err) => {
    els.budgetBody.innerHTML = '<tr><td colspan="5" class="empty-note">読み込みエラー：Firebase設定・公開ルールをご確認ください</td></tr>';
  });

  function renderBudget() {
    els.addBudgetRow.style.display = canEdit() ? "flex" : "none";
    const editable = canEdit();
    if (budgetCache.length === 0) {
      els.budgetBody.innerHTML = `<tr><td colspan="5" class="empty-note">まだ項目がありません</td></tr>`;
    } else {
      els.budgetBody.innerHTML = "";
      budgetCache.forEach((b) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="${b.type === "income" ? "type-income" : "type-expense"}">${b.type === "income" ? "収入" : "支出"}</td>
          <td>${editable ? `<input class="label-input" value="${escapeHtml(b.label || "")}">` : escapeHtml(b.label || "")}</td>
          <td class="amount">${editable ? `<input class="amount-input" type="number" value="${b.amount || 0}">` : yen(b.amount || 0)}</td>
          <td>${editable ? `<input class="note-input" value="${escapeHtml(b.note || "")}">` : escapeHtml(b.note || "")}</td>
          <td>${editable ? '<button class="budget-del">✕</button>' : ""}</td>
        `;
        const labelInput = tr.querySelector(".label-input");
        if (labelInput) labelInput.addEventListener("blur", (e) => {
          if (!canEdit()) return;
          db.collection("budget").doc(b.id).update({ label: e.target.value });
        });
        const amountInput = tr.querySelector(".amount-input");
        if (amountInput) amountInput.addEventListener("blur", (e) => {
          if (!canEdit()) return;
          db.collection("budget").doc(b.id).update({ amount: Number(e.target.value) || 0 });
        });
        const noteInput = tr.querySelector(".note-input");
        if (noteInput) noteInput.addEventListener("blur", (e) => {
          if (!canEdit()) return;
          db.collection("budget").doc(b.id).update({ note: e.target.value });
        });
        const delBtn = tr.querySelector(".budget-del");
        if (delBtn) delBtn.addEventListener("click", () => {
          if (!canEdit()) return;
          if (confirm("この項目を削除しますか？")) db.collection("budget").doc(b.id).delete();
        });
        els.budgetBody.appendChild(tr);
      });
    }
    const income = budgetCache.filter((b) => b.type === "income").reduce((s, b) => s + (Number(b.amount) || 0), 0);
    const expense = budgetCache.filter((b) => b.type === "expense").reduce((s, b) => s + (Number(b.amount) || 0), 0);
    els.sumIncome.textContent = yen(income);
    els.sumExpense.textContent = yen(expense);
    const balance = income - expense;
    els.sumBalance.textContent = yen(balance);
    els.sumBalance.className = "val " + (balance >= 0 ? "plus" : "minus");
  }

  els.newBudgetAdd.addEventListener("click", () => {
    if (!canEdit()) return;
    const label = els.newBudgetLabel.value.trim();
    if (!label) return;
    db.collection("budget").add({
      type: els.newBudgetType.value,
      label,
      amount: Number(els.newBudgetAmount.value) || 0,
      note: "",
    });
    els.newBudgetLabel.value = "";
    els.newBudgetAmount.value = "";
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  setMode("view");
</script>
</body>
</html>
